<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills | Prasad's Premium Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/skills.css">
</head>
<body>
    <main class="main-container">
        <section class="hero-section">
            <div class="spotlight"></div>
            <div class="container reveal">
                <h1 class="hero-title">Technical Expertise</h1>
                <p class="hero-subtitle">Mastering the tools that shape the future.</p>
            </div>
        </section>

        <section class="skills-grid-section">
            <div class="container">
                <div class="skills-grid grid reveal">
                    <div class="skill-category">
                        <div class="category-header">
                            <i class="fa-solid fa-laptop-code"></i>
                            <h3>Frontend Development</h3>
                        </div>
                        <div class="skill-list">
                            <div class="skill-item">
                                <div class="skill-info"><span>HTML/CSS/JS</span><span>95%</span></div>
                                <div class="skill-bar"><div class="skill-progress" style="width: 95%;"></div></div>
                            </div>
                            <div class="skill-item">
                                <div class="skill-info"><span>React/Next.js</span><span>90%</span></div>
                                <div class="skill-bar"><div class="skill-progress" style="width: 90%;"></div></div>
                            </div>
                            <div class="skill-item">
                                <div class="skill-info"><span>Tailwind CSS</span><span>85%</span></div>
                                <div class="skill-bar"><div class="skill-progress" style="width: 85%;"></div></div>
                            </div>
                        </div>
                    </div>



                    <div class="skill-category">
                        <div class="category-header">
                            <i class="fa-solid fa-user-shield"></i>
                            <h3>Cybersecurity</h3>
                        </div>
                        <div class="skill-list">
                            <div class="skill-item">
                                <div class="skill-info"><span>Penetration Testing</span><span>80%</span></div>
                                <div class="skill-bar"><div class="skill-progress" style="width: 80%;"></div></div>
                            </div>
                            <div class="skill-item">
                                <div class="skill-info"><span>Network Security</span><span>85%</span></div>
                                <div class="skill-bar"><div class="skill-progress" style="width: 85%;"></div></div>
                            </div>
                            <div class="skill-item">
                                <div class="skill-info"><span>Vulnerability Assessment</span><span>82%</span></div>
                                <div class="skill-bar"><div class="skill-progress" style="width: 82%;"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);
        document.querySelectorAll('.reveal').forEach((el) => {
            gsap.from(el, {
                scrollTrigger: { trigger: el, start: "top 85%", toggleActions: "play none none none" },
                y: 50, opacity: 0, duration: 1, ease: "power3.out"
            });
        });
        
        document.querySelectorAll('.skill-progress').forEach((el) => {
            gsap.from(el, {
                scrollTrigger: { trigger: el, start: "top 95%" },
                width: 0, duration: 1.5, ease: "power3.out"
            });
        });
    </script>
</body>
</html>
